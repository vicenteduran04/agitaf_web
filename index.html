<style>
:root{--bg:#06142b;--card:#0c2142;--bd:#1d3a66;--tx:#eef2fa;--mut:#9db0cf;--ac:#5aa800;--or:#5aa800;--bl:#6d8dff;--trk:#1d3a66;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="dark"]){--bg:#f3f8ec;--card:#fff;--bd:#d6e4c4;--tx:#0a2038;--mut:#5a6b86;--ac:#3f7d00;--or:#3f7d00;--bl:#2845b0;--trk:#e3edd5}
html,body{background:var(--bg)}
body{color:var(--tx);font-family:"Space Grotesk",system-ui,sans-serif;transition:background .5s;background-image:radial-gradient(60rem 30rem at 90% -10%,color-mix(in srgb,var(--or) 14%,transparent),transparent),radial-gradient(60rem 30rem at -10% 0,color-mix(in srgb,var(--bl) 14%,transparent),transparent);background-repeat:no-repeat}
.serif{font-family:"Playfair Display",Georgia,serif}
.card{background:var(--card);border:1px solid var(--bd)}
.mut{color:var(--mut)}.ac{color:var(--ac)}.or{color:var(--or)}.bgac{background:var(--ac)}.bgor{background:var(--or)}
.grad{background:linear-gradient(90deg,var(--or),#a6e35a);-webkit-background-clip:text;background-clip:text;color:transparent}
.inp{width:100%;background:transparent;border:1px solid var(--bd);border-radius:.5rem;padding:.75rem 1rem;color:var(--tx);outline:none}
.inp:focus{border-color:var(--ac)}
.btn{padding:.75rem 1.25rem;border-radius:.5rem;font-weight:500;color:#fff;transition:opacity .2s}.btn:hover{opacity:.9}.btn:disabled{opacity:.4;cursor:not-allowed}
.frame{background:#fff;border:4px solid #0a2038;border-radius:1.5rem;overflow:hidden}.blue{color:var(--bl)}
.riskbg{background:#450a0a!important}
</style>

          if (st.pk.t - st.last >= 0.35) { ev = st.pk; st.last = st.pk.t; }
          st.act = false; st.pk = null;
          if (over && g >= this.thr) { st.act = true; st.t0 = t; st.pk = { g, w, t }; }
        }
      }
      if (ev) {
        H.ev.push({ s: k + 1, t: ev.t - H.t0, ms: Math.round(ev.t * 1000), g: ev.g, w: ev.w, hora: new Date().toLocaleTimeString('es-CL', { hour12: false }) });
        d.n++; d.pico = ev.g; d.picoW = ev.w;
        const r = scoreEvent(d.score, ev.g, ev.w);
        if (r === 2) this.emit();
        if (r === 1 && this.onRisk && this.alertsOn) this.onRisk(role);

  onLine(role, line) {
    const q = line.split(',');
    if (q.length === 15 && !isNaN(+q[0])) { this.both(); this.onRow(q); return; }
    if (role === 'hc05') { if (line[0] === '#') Object.values(this.data).forEach(d => { if (d) d.msg = line; }); return; }
    const d = this.data[role]; if (!d || !line) return;
    const p = line.split(',');
    if (p[0] === 'D' || p[0] === 'DATO') {
      const a = +p[2], w = +p[3], n = +p[4];
      if (!isNaN(a) && !isNaN(w)) { d.a = a; d.w = w; if (!isNaN(n)) d.n = n; }
    } else if (p[0] === 'E' || p[0] === 'EVENTO') {
      const long = p[0] === 'EVENTO';
      const n = +(long ? p[4] : p[2]), pk = +(long ? p[5] : p[3]), gw = +(long ? p[6] : p[4]);
      if (isNaN(n) || isNaN(pk) || isNaN(gw)) return;
      d.n = n; d.pico = pk; d.picoW = gw;
      const r = scoreEvent(d.score, pk, gw);
      if (r === 2) this.emit();
      if (r === 1 && this.onRisk) this.onRisk(role);
    } else if (line[0] === '#') d.msg = line;
  },
  async connect(role) {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'AGITAF' }, { services: [NUS.svc] }, { services: [0xffe0] }], optionalServices: [NUS.svc, 0xffe0] });
    const server = await dev.gatt.connect();
    let tx, rx;
    try { const sv = await server.getPrimaryService(NUS.svc); tx = await sv.getCharacteristic(NUS.tx); rx = await sv.getCharacteristic(NUS.rx); }
    catch (e) { const sv = await server.getPrimaryService(0xffe0); tx = rx = await sv.getCharacteristic(0xffe1); }
    this.data[role] = { a: 1, w: 0, n: 0, pico: 0, picoW: 0, msg: '', score: newScore() };
    if (!Object.keys(this.links).length) this.resetH();
    const dec = new TextDecoder(); let buf = '';
    tx.addEventListener('characteristicvaluechanged', ev => {
      buf += dec.decode(ev.target.value, { stream: true });
      let i; while ((i = buf.indexOf('\n')) >= 0) { this.onLine(role, buf.slice(0, i).trim()); buf = buf.slice(i + 1); }
    });
    await tx.startNotifications();
    dev.addEventListener('gattserverdisconnected', () => { delete this.links[role]; this.data[role] = null; this.emit(); });
    this.links[role] = { dev, name: dev.name || role, write: d => (rx.writeValueWithoutResponse ? rx.writeValueWithoutResponse(d) : rx.writeValue(d)), close: () => { if (dev.gatt.connected) dev.gatt.disconnect(); } };
    this.emit();
  },
  // HC-05 (Bluetooth clásico): se empareja en el sistema y aparece como puerto serie; se lee con Web Serial (solo computador).
  async connectSerial(_role, baud = 115200) {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: baud });
    this.resetH();
    ['muslo', 'pantorrilla'].forEach(r => { this.data[r] = { a: 1, w: 0, n: 0, pico: 0, picoW: 0, msg: '', score: newScore() }; });
    const reader = port.readable.getReader(), writer = port.writable.getWriter();
    const close = () => reader.cancel().catch(() => {});
    this.links.muslo = { name: 'HC-05 · muslo', write: d => writer.write(d), close };
    this.links.pantorrilla = { name: 'HC-05 · tibia', write: d => writer.write(d), close };
    this.emit();
    const dec = new TextDecoder(); let buf = '';
    (async () => {
      try {
        while (true) {
          const { value, done } = await reader.read(); if (done) break;
          buf += dec.decode(value, { stream: true });
          let i; while ((i = buf.indexOf('\n')) >= 0) { this.onLine('hc05', buf.slice(0, i).trim()); buf = buf.slice(i + 1); }
        }
      } catch (e) {}
      try { reader.releaseLock(); writer.releaseLock(); await port.close(); } catch (e) {}
      delete this.links.muslo; delete this.links.pantorrilla; this.data.muslo = null; this.data.pantorrilla = null; this.emit();
    })();
  },
  disconnect(role) { const l = this.links[role]; if (l) l.close(); },
  async cmd(str) {
    if (str.includes('C')) Object.values(this.data).forEach(d => { if (d) { d.n = 0; d.score = newScore(); } });
    for (const ch of str) for (const l of Object.values(this.links)) { try { await l.write(new TextEncoder().encode(ch)); } catch (e) {} }
    this.emit();
  },

const VIDEO_SRC = "AGITAF_pitch_1080p_final.mp4";
function DemoVideo({ title = 'Pitch AGITAF', sub = 'El problema, la solución y el modelo de negocio' }) {
  const [fail, setFail] = useState(false);
  return html`<div class="card rounded-xl p-4 sm:p-6 mb-8">
    <p class="or text-xs font-semibold" style=${{ letterSpacing: '.25em' }}>VIDEO</p>
    <h3 class="serif text-2xl sm:text-3xl mt-1">${title}</h3>
    <p class="mut text-sm mb-4">${sub}</p>
    <div class="frame" style=${{ aspectRatio: '16 / 9', background: '#000' }}>
      <video src=${VIDEO_SRC} poster=${DEMO.poster} controls playsInline preload="metadata" onError=${() => setFail(true)} class="w-full h-full" style=${{ display: 'block', background: '#000' }}></video>
    </div>
    ${fail && html`<p class="text-xs text-red-400 mt-2">No se pudo cargar el video. Revisa que ${VIDEO_SRC} esté en la misma carpeta que index.html.</p>`}
  </div>`;
}

function Hero({ eyebrow, l1, l2, desc, side }) {
  return html`<section class="pt-12 pb-8 flex flex-col lg:flex-row lg:items-center justify-between gap-10"><div class="min-w-0">
    <div class="w-20 h-0.5 mb-10" style=${{ background: 'linear-gradient(90deg,var(--or),#a6e35a)' }}></div>
    <p class="ac uppercase text-sm sm:text-base mb-6" style=${{ letterSpacing: '.28em' }}>${eyebrow}</p>
    <h1 class="serif text-5xl sm:text-7xl leading-[1.05]">${l1}<br/><span class="grad">${l2}</span></h1>
    <p class="mut text-lg sm:text-xl mt-6 max-w-2xl leading-relaxed">${desc}</p></div>${side}
  </section>`;
}

function Spark({ data, color }) {
  const pts = data.map((v, i) => `${(i / (N - 1)) * 300},${100 - v}`).join(' ');
  return html`<svg viewBox="0 0 300 100" preserveAspectRatio="none" class="w-full h-24">
    ${[25, 50, 75].map(y => html`<line key=${y} x1="0" x2="300" y1=${y} y2=${y} stroke="var(--bd)" stroke-width="1"/>`)}
    <line x1="0" x2="300" y1="15" y2="15" stroke="#ef4444" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/>
    <polyline points=${pts} fill="none" stroke=${color} stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function SensorCard({ title, sub, data, fatigue, risk }) {
  const v = Math.round(data[data.length - 1] || 0);
  const lvl = v >= 85 ? 'CRÍTICO' : v >= 65 ? 'ELEVADO' : 'NORMAL';
  const col = v >= 85 ? '#ef4444' : v >= 65 ? '#ff6a00' : '#6d8dff';
  return html`<div class=${'card rounded-xl p-5 ' + (risk ? '!border-red-500/70' : '')}>
    <div class="flex items-start justify-between">
      <div><h3 class="serif text-2xl">${title}</h3><p class="text-xs mut">${sub}</p></div>
      <span class="text-xs font-semibold px-2 py-1 rounded-full" style=${{ background: col + '22', color: col }}>${lvl}</span>
    </div>
    <div class="flex items-end gap-2 mt-3"><span class="text-5xl font-semibold tabular-nums" style=${{ color: col }}>${v}</span><span class="mut mb-1">% activación</span></div>
    <${Spark} data=${data} color=${col} />
    <div class="mt-3">
      <div class="flex justify-between text-xs mut mb-1"><span>Índice de fatiga</span><span>${Math.round(fatigue)}%</span></div>
      <div class="h-1.5 rounded-full overflow-hidden" style=${{ background: 'var(--trk)' }}><div class="h-full rounded-full transition-all" style=${{ width: fatigue + '%', background: col }}></div></div>
    </div>
  </div>`;
}

function ConnectBar({ source, connecting, err, onConnect, onDemo }) {
  const real = Object.keys(BT.links).length > 0, sim = !!BT.demoTimer;
  return html`<div class="space-y-3">
    <div class="flex flex-wrap items-center gap-3">
      <button onClick=${onConnect} disabled=${!!connecting} class=${'px-5 py-3 rounded-lg font-medium text-sm transition ' + (real ? 'card ac' : 'bgac text-white hover:opacity-90') + (connecting ? ' animate-pulse' : '')}>${real ? '● Rodillera conectada · Desconectar' : connecting ? 'Buscando rodillera…' : 'Conectar rodillera'}</button>
      ${!real && html`<button onClick=${onDemo} class="text-sm mut underline">${sim ? 'Detener simulación' : 'Simular datos'}</button>`}
    </div>
    <p class="text-xs mut">${real ? Object.values(BT.links)[0].name + ' · datos reales por Bluetooth' : sim ? 'Simulación activa · datos de demostración, sin rodillera.' : 'Enciende la rodillera, empareja el HC-05 en el Bluetooth del computador y toca Conectar.'}</p>
    ${!BT.ok && !BT.okSerial && html`<p class="text-xs text-red-400">Este navegador no admite Bluetooth. Usa Chrome o Edge.</p>`}
    ${err && html`<p class="text-xs text-red-400">${err}</p>`}
  </div>`;
}

function AlertBanner({ risk, setRisk }) {
  return risk ? html`<div class="rounded-xl bg-red-600 text-white p-5 shadow-[0_0_40px_rgba(239,68,68,.45)] animate-pulse mb-4">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div><p class="text-xs font-semibold" style=${{ letterSpacing: '.25em' }}>⚠ ALERTA CRÍTICA · ENTRENAMIENTO</p>
        <h2 class="serif text-3xl mt-2">Detener actividad y descansar</h2>
        <p class="mt-2 text-red-50 max-w-2xl">${STAGES['Entrenamiento'].alert}</p></div>
      <button onClick=${() => setRisk(false)} class="px-4 py-2 rounded-lg bg-white text-red-700 font-semibold text-sm">Reconocer alerta</button>
    </div></div>` : null;
}
function AlertCards({ risk, setRisk, conn, source }) {
  const stage = 'Entrenamiento';
  const [thigh, setThigh] = useState(Array(N).fill(0));
  const [shin, setShin] = useState(Array(N).fill(0));
  const [fat, setFat] = useState({ t: 0, s: 0 });
  const [secs, setSecs] = useState(0);
  const t = useRef(0);
  const live = conn === 'on';
  useEffect(() => { if (live) { setSecs(0); setFat({ t: 0, s: 0 }); } }, [live]);
  useEffect(() => {
    if (!live) return;
    const id = setInterval(() => {
      t.current += 1;
      const b = STAGES[stage].base;
      const nT = source === 'ble' ? actOf(BT.data.muslo) : clamp(b + (risk ? 30 : 0) + Math.sin(t.current / 5) * 9 + (Math.random() - .5) * 8, 3, 100);
      const nS = source === 'ble' ? actOf(BT.data.pantorrilla) : clamp(b * .85 + (risk ? 24 : 0) + Math.sin(t.current / 4 + 1) * 8 + (Math.random() - .5) * (risk ? 16 : 8), 3, 100);
      setThigh(d => [...d.slice(1), nT]);
      setShin(d => [...d.slice(1), nS]);
      setFat(f => ({ t: clamp(f.t + nT / 2500, 0, 100), s: clamp(f.s + nS / 2500, 0, 100) }));
    }, 150);
    const cl = setInterval(() => setSecs(s => s + 1), 1000);
    return () => { clearInterval(id); clearInterval(cl); };
  }, [live, stage, risk, source]);
  const asym = Math.round(Math.abs(thigh[N - 1] - shin[N - 1]));
  return html`<div>

function Login({ onAuth }) {
  const [mode, setMode] = useState('in');
  const [name, setName] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const submit = async () => {
    const key = name.trim().toLowerCase();
    if (key.length < 3) return setErr('El usuario debe tener al menos 3 caracteres.');
    if (pw.length < 4) return setErr('La contraseña debe tener al menos 4 caracteres.');
    const users = LS.g('agitaf_users', {});
    const h = await hash(pw);
    if (mode === 'up') {
      if (users[key]) return setErr('Ese nombre de usuario ya existe. Elige otro.');
      users[key] = { name: name.trim(), h }; LS.s('agitaf_users', users);
    } else if (!users[key] || users[key].h !== h) return setErr('Usuario o contraseña incorrectos.');
    onAuth(users[key].name);
  };
  const enter = e => { if (e.key === 'Enter') submit(); };
  return html`<div class="pb-16">
    <${Hero} eyebrow="Acceso" l1="Ingresa a" l2="AGITAF" desc="Crea tu cuenta con un nombre de usuario y una contraseña, o inicia sesión si ya tienes una." side=${LogoSide()} />
    <div class="card rounded-xl p-6 max-w-md">
      <div class="flex gap-2 mb-5">
        ${[['in', 'Iniciar sesión'], ['up', 'Registrarse']].map(([k, l]) => html`<button key=${k} onClick=${() => { setMode(k); setErr(''); }} class=${'px-4 py-2 rounded-lg text-sm font-medium border ' + (mode === k ? 'bgac text-white border-transparent' : 'border-[color:var(--bd)] mut')}>${l}</button>`)}
      </div>
      <div class="space-y-3">
        <input class="inp" placeholder="Nombre de usuario" value=${name} onInput=${e => setName(e.target.value)} onKeyDown=${enter} autocomplete="username" />
        <input class="inp" type="password" placeholder="Contraseña" value=${pw} onInput=${e => setPw(e.target.value)} onKeyDown=${enter} autocomplete=${mode === 'up' ? 'new-password' : 'current-password'} />
        ${err && html`<p class="text-sm text-red-400">${err}</p>`}
        <button onClick=${submit} class="btn bgor w-full">${mode === 'up' ? 'Crear cuenta' : 'Entrar'}</button>
      </div>
    </div>
  </div>`;
}

function Inicio({ user, go, conn, source, cb }) {
  const key = 'agitaf_cal_' + user.toLowerCase();
  const [cal, setCal] = useState(LS.g(key, 0));
  const [calRun, setCalRun] = useState(false);
  const [calJ, setCalJ] = useState(0);
  const TARGET = 20;
  useEffect(() => {
    if (!calRun) return;
    const id = setInterval(() => setCalJ(j => BT.jumps()), 300);
    return () => clearInterval(id);
  }, [calRun]);
  useEffect(() => {
    if (calRun && calJ >= TARGET) { setCalRun(false); BT.cmd('P'); const c = Math.min(3, cal + 1); setCal(c); LS.s(key, c); }
  }, [calJ, calRun]);
  useEffect(() => { if (conn !== 'on') setCalRun(false); }, [conn]);
  const done = cal >= 3;
  const Btn = (label, fn, dis) => html`<button onClick=${fn} disabled=${dis} class="btn bgor w-full mt-auto">${label}</button>`;
  return html`<div class="pb-16">
    <${Hero} eyebrow=${'Hola, ' + user} l1="Conecta y calibra" l2="tu rodillera" desc="Conecta la rodillera AGITAF con un solo toque, calibra tus sensores y entra al Panel para ver tu entrenamiento en vivo." side=${LogoSide()} />
    <div class="mb-6"><${ConnectBar} ...${cb} /></div>
    <button onClick=${() => go('panel')} class="ac text-sm mb-6 block">Ver mi entrenamiento en el Panel →</button>
    <div class="max-w-2xl">
      <div class="card rounded-xl p-6 flex flex-col gap-3">
        <p class="or text-xs font-semibold" style=${{ letterSpacing: '.25em' }}>AGITAF</p>
        <h3 class="serif text-3xl">Calibración</h3>
        <p class="mut">${done ? 'Sensores calibrados ✓' : 'Sesión de calibración ' + (cal + 1) + ' de 3'}</p>
        <div class="flex gap-2 my-2">${[0, 1, 2].map(i => html`<div key=${i} class="h-2 flex-1 rounded-full" style=${{ background: i < cal ? 'var(--or)' : 'var(--trk)' }}></div>`)}</div>

          : html`<p class="text-sm mut flex-1">El dispositivo tiene un par de sesiones de calibración al comienzo. En ellas te pide hacer unos 15 a 20 saltos o aceleraciones fuertes para ajustarse a ti, y a partir de la tercera sesión queda calibrado. Además, los primeros 20 saltos de cada sesión fijan tu punto de partida del día, lo que anula el efecto de volver a colocar los sensores.</p>`}

      </div>
    </div>
    <div class="mt-8"><${DemoVideo} title="Pitch AGITAF" sub="Conoce el proyecto en menos de un minuto y medio" /></div>
    ${DidYouKnow()}
  </div>`;
}

      ${opts.map(([k, t, d]) => html`<button key=${k} onClick=${() => setSub(k)} class="card rounded-xl p-8 text-left hover:opacity-90 transition">
        <h3 class="serif text-3xl">${t}</h3><p class="mut mt-3 leading-relaxed">${d}</p><p class="or mt-6 text-sm font-semibold">Ver →</p>
      </button>`)}
    </div>
  </div>`;
}

// ===== PANEL EN VIVO (versión web del panel Python) =====
function plot(cv, H, ia, ib, title, thr, win, marks) {
  if (!cv) return;
  const r = window.devicePixelRatio || 1, W = cv.clientWidth, Hh = cv.clientHeight;
  if (cv.width !== Math.round(W * r)) { cv.width = Math.round(W * r); cv.height = Math.round(Hh * r); }
  const c = cv.getContext('2d'); c.setTransform(r, 0, 0, r, 0, 0); c.clearRect(0, 0, W, Hh);
  const rows = H.rows, tmax = rows.length ? rows[rows.length - 1][0] : 0, t0 = Math.max(0, tmax - win);
  let i0 = rows.length, hi = 0; while (i0 > 0 && rows[i0 - 1][0] >= t0) i0--;
  for (let i = i0; i < rows.length; i++) hi = Math.max(hi, rows[i][ia], rows[i][ib]);
  hi = Math.max(hi * 1.1, thr ? thr + 0.5 : 1);
  const L = 44, T = 24, B = 20, pw = W - L - 10, ph = Hh - T - B, X = t => L + (t - t0) / win * pw, Y = v => T + ph - v / hi * ph;
  c.font = '11px sans-serif'; c.fillStyle = '#9fb0c6'; c.lineWidth = 1; c.strokeStyle = 'rgba(140,160,180,.25)';
  c.fillText(title, L, 14);
  [['Sensor 1 · muslo', '#45cbb5'], ['Sensor 2 · tibia', '#f9ba72']].forEach(([l, col], k) => { c.fillStyle = col; c.fillText(l, W - 250 + k * 125, 14); c.fillStyle = '#9fb0c6'; });
  for (let k = 0; k <= 4; k++) { const v = hi * k / 4, y = Y(v); c.beginPath(); c.moveTo(L, y); c.lineTo(L + pw, y); c.stroke(); c.fillText(v.toFixed(hi > 20 ? 0 : 1), 4, y + 4); const tt = t0 + win * k / 4; c.fillText(tt.toFixed(0), X(tt) - 6, Hh - 5); }
  if (thr) { c.setLineDash([5, 4]); c.strokeStyle = 'rgba(249,186,114,.7)'; c.beginPath(); c.moveTo(L, Y(thr)); c.lineTo(L + pw, Y(thr)); c.stroke(); c.setLineDash([]); }
  [[ia, '#45cbb5'], [ib, '#f9ba72']].forEach(([k, col]) => { c.beginPath(); c.strokeStyle = col; c.lineWidth = 1.4; for (let i = i0; i < rows.length; i++) { const x = X(rows[i][0]), y = Y(rows[i][k]); i === i0 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); });
  if (marks) for (let i = H.ev.length - 1; i >= 0 && H.ev[i].t >= t0; i--) { const e = H.ev[i]; c.beginPath(); c.strokeStyle = e.s === 1 ? '#45cbb5' : '#f9ba72'; c.lineWidth = 1.7; c.arc(X(e.t), Y(e.g), 5, 0, 7); c.stroke(); }
}
function analyze(H) {
  const R = H.rows, dur = R.length > 1 ? R[R.length - 1][0] - R[0][0] : 0, third = dur / 3, mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
  return { dur, out: [1, 2].map(s => {
    const ev = H.ev.filter(e => e.s === s), gr = [[], [], []];
    ev.forEach(e => gr[third ? Math.min(2, Math.floor(e.t / third)) : 0].push(e.g));
    const med = gr.map(mean), mx = i => R.reduce((m, r) => Math.max(m, r[i]), 0);
    return { s, n: ev.length, perMin: dur ? 60 * ev.length / dur : null, maxG: mx(s), maxW: mx(s + 2), n3: gr.map(x => x.length), med, ch: med[0] && med[2] ? 100 * (med[2] - med[0]) / med[0] : null };
  }) };
}
function PanelLive({ cb, risk, setRisk, conn, source }) {
  BT.alertsOn = true;
  const [, tick] = useState(0), [coach, setCoach] = useState(false), [sum, setSum] = useState(false), [jug, setJug] = useState(''), [ej, setEj] = useState(''), [thr, setThr] = useState(String(BT.thr));
  const c1 = React.useRef(null), c2 = React.useRef(null);
  useEffect(() => { const id = setInterval(() => tick(x => x + 1), 150); return () => clearInterval(id); }, []);
  useEffect(() => { plot(c1.current, BT.H, 1, 2, 'Aceleración total (g)', BT.thr, 12, true); plot(c2.current, BT.H, 3, 4, 'Rapidez de giro · magnitud (°/s)', 0, 12, false); });
  const H = BT.H, R = H.rows, n = R.length, last = n ? R[n - 1][0] : 0, on = Object.keys(BT.links).length > 0 || !!BT.demoTimer;
  let hz = 0; for (let i = n - 1; i >= 0 && R[i][0] > last - 1; i--) hz++;
  const mx = i => R.reduce((m, r) => Math.max(m, r[i]), 0), e1 = H.ev.filter(e => e.s === 1).length, e2 = H.ev.length - e1;
  const A = coach || sum ? analyze(H) : null;
  const kpis = [['Registros', n], ['Frecuencia', hz + ' Hz'], ['Máx. sensor 1', n ? mx(1).toFixed(2) + ' g' : '— g'], ['Máx. sensor 2', n ? mx(2).toFixed(2) + ' g' : '— g'], ['Eventos detectados', H.ev.length], ['Muestras faltantes', H.miss]];
  const dl = (name, txt) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + txt], { type: 'text/csv' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); };
  const stamp = () => new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
  const expEv = () => n ? dl('innova_eventos_' + stamp() + '.csv', ['sensor,t_seg_desde_inicio,t_ms_arduino,hora_recepcion_pc_aproximada,aceleracion_pico_g,velocidad_angular_en_pico_grados_s,umbral_g,tipo_evento'].concat(H.ev.map(e => [e.s, e.t.toFixed(3), e.ms, e.hora, e.g.toFixed(3), e.w.toFixed(2), BT.thr, 'Pico de aceleracion (no salto confirmado)'].join(','))).join('\n')) : alert('Primero registra o prueba una sesión.');
  const expRaw = () => n ? dl('innova_datos_' + stamp() + '.csv', ['t_ms,ax1,ay1,az1,a1_g,gx1,gy1,gz1,ax2,ay2,az2,a2_g,gx2,gy2,gz2'].concat(H.raw.map(r => r.join(','))).join('\n')) : alert('Primero registra o prueba una sesión.');
  const stop = () => { Object.keys(BT.links).forEach(r => BT.disconnect(r)); if (BT.demoTimer) BT.demoToggle(); };

  const f1 = x => x == null ? 'Sin datos' : x.toFixed(2);
  return html`<div class="pb-16">
    <${Hero} eyebrow="Panel en vivo · Muslo y tibia" l1="Panel de movimiento" l2="y alertas" desc="Aceleración y giro de ambos sensores en tiempo real. Alertas de sobrecarga durante el entrenamiento. Los picos son eventos de movimiento, no acciones confirmadas." side=${LogoSide()} />

    <div class="grid sm:grid-cols-2 gap-3 mb-4">
      <input value=${jug} onInput=${e => setJug(e.target.value)} placeholder="Futbolista" class="card rounded-md px-3 py-2 text-sm bg-transparent"/>
      <input value=${ej} onInput=${e => setEj(e.target.value)} placeholder="Ejercicio (ej. caminata en cinta)" class="card rounded-md px-3 py-2 text-sm bg-transparent"/>
    </div>
    <div class="flex flex-wrap items-center gap-2 mb-4">
      ${!Object.keys(BT.links).length && bt('Conectar rodillera', cb.onConnect, 'bgac text-white')}
      ${!Object.keys(BT.links).length && bt(BT.demoTimer ? 'Detener simulación' : 'Simular datos', () => BT.demoToggle(), BT.demoTimer ? 'card' : 'bgor text-white')}
      ${Object.keys(BT.links).length > 0 && bt('Desconectar', stop)}
      ${bt('Exportar eventos', expEv)}${bt('Exportar datos', expRaw)}
      ${bt('Vista entrenador', () => setCoach(!coach), coach ? 'bgac text-white' : 'card')}${bt('Resumen', () => setSum(!sum))}
      ${bt('Nueva sesión', () => BT.resetH())}
      <span class="text-sm mut ml-2">Umbral</span><input value=${thr} onInput=${e => setThr(e.target.value)} class="card rounded-md px-2 py-2 text-sm w-16 bg-transparent"/><span class="text-sm mut">g</span>
      ${bt('Aplicar', () => { const v = parseFloat(thr.replace(',', '.')); if (v > 0.5 && v < 16) BT.thr = v; else alert('Umbral entre 0,5 y 16 g'); })}
    </div>
    ${cb.err && html`<p class="text-sm text-red-400 mb-3">${cb.err}</p>`}
    ${!BT.okSerial && !BT.ok && html`<p class="text-xs text-red-400 mb-3">Este navegador no admite Bluetooth ni puerto serie. Usa Chrome o Edge.</p>`}
    <p class="text-sm mb-3 ${on ? 'or' : 'mut'}">${BT.demoTimer ? 'Mostrando datos de demostración.' : on ? 'Conectado · recibiendo datos de la rodillera.' : 'Sin conexión. Conecta la rodillera o toca “Simular datos”.'}</p>
    <div class="grid grid-cols-2 md:grid-cols-6 gap-3 mb-4">${kpis.map(([t, v]) => html`<div key=${t} class="card rounded-xl p-3"><p class="text-xs mut">${t}</p><p class="serif text-2xl">${v}</p></div>`)}</div>
    <div class="grid lg:grid-cols-3 gap-4">
      <div class="card rounded-xl p-3 lg:col-span-2"><canvas ref=${c1} style=${{ width: '100%', height: '230px', display: 'block' }}></canvas><canvas ref=${c2} style=${{ width: '100%', height: '200px', display: 'block' }}></canvas><p class="text-xs mut text-center">Tiempo desde la primera muestra (s)</p></div>
      <div class="card rounded-xl p-4"><h3 class="serif text-xl">Eventos de aceleración</h3><p class="text-xs mut mb-2">Cada marcador es un pico local, no un salto validado.</p><p class="or font-semibold text-sm mb-2">Sensor 1: ${e1} · Sensor 2: ${e2}</p>
        <table class="w-full text-xs text-center"><thead class="mut"><tr><th>t (s)</th><th>Hora PC*</th><th>IMU</th><th>Pico (g)</th><th>Giro (°/s)</th></tr></thead><tbody>${H.ev.slice(-12).reverse().map((e, i) => html`<tr key=${i} class="border-t" style=${{ borderColor: 'var(--bd)' }}><td>${e.t.toFixed(2)}</td><td>${e.hora}</td><td>${e.s}</td><td>${e.g.toFixed(2)}</td><td>${e.w.toFixed(0)}</td></tr>`)}</tbody></table>
        <p class="text-xs mut mt-3">100 °/s es una rapidez de rotación de 100 grados por segundo. No equivale al ángulo de rodilla. *Hora aproximada de recepción.</p></div>
    </div>
    <${AlertCards} risk=${risk} setRisk=${setRisk} conn=${conn} source=${source} />
    ${sum && A && html`<div class="card rounded-xl p-4 mt-4 text-sm">Duración ${A.dur.toFixed(1)} s · ${n} muestras · ${H.ev.length} eventos (umbral ${BT.thr.toFixed(2)} g) · ${A.out.map(d => 'IMU ' + d.s + ': máx ' + f1(d.maxG) + ' g, giro máx ' + d.maxW.toFixed(0) + ' °/s').join(' · ')}</div>`}
    ${coach && A && html`<div class="card rounded-xl p-5 mt-4">
      <p class="or text-xs font-semibold uppercase" style=${{ letterSpacing: '.2em' }}>Informe de entrenamiento</p>
      <h3 class="serif text-3xl">${jug || 'Sin identificar'}</h3><p class="mut text-sm mb-4">Ejercicio: ${ej || 'No especificado'} · Umbral de eventos: ${BT.thr.toFixed(2)} g</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">${[['Duración', A.dur.toFixed(1) + ' s'], ['Muestras', n], ['Picos IMU 1', A.out[0].n], ['Picos IMU 2', A.out[1].n]].map(([t, v]) => html`<div key=${t} class="rounded-lg p-3" style=${{ background: 'var(--trk)' }}><p class="text-xs mut">${t}</p><p class="serif text-2xl">${v}</p></div>`)}</div>
      <p class="font-medium mb-2">Pico medio de aceleración por tercio de la sesión</p>
      <div class="grid grid-cols-3 gap-3 items-end" style=${{ height: '140px' }}>${['Inicio', 'Mitad', 'Final'].map((l, k) => { const top = Math.max(0.1, ...A.out.flatMap(d => d.med.map(m => m || 0))); return html`<div key=${l} class="flex flex-col justify-end h-full"><div class="flex gap-1 items-end h-full">${A.out.map((d, si) => html`<div key=${si} class="flex-1 rounded-t text-center text-xs" style=${{ height: ((d.med[k] || 0) / top * 100) + '%', background: si ? '#f9ba72' : '#45cbb5', color: '#06142b', minHeight: '2px' }}>${d.med[k] ? d.med[k].toFixed(2) : ''}</div>`)}</div><p class="text-xs mut text-center mt-1">${l}</p></div>`; })}</div>
      <p class="text-xs mut mt-1">Verde: IMU 1 (muslo) · Naranja: IMU 2 (tibia)</p>

      <p class="text-xs mut mt-3">Indicadores exploratorios · no equivalen a diagnóstico clínico, fatiga ni riesgo de lesión.</p></div>`}
    <div class="card rounded-xl p-5 mt-6"><h3 class="serif text-xl mb-2">Cómo conectar tu rodillera</h3>
      <ol class="mut text-sm leading-relaxed list-decimal pl-5 space-y-1"><li>Enciende la rodillera y deja los sensores quietos unos segundos mientras se calibran.</li><li>En el Bluetooth del computador, empareja el módulo “HC-05” (la clave suele ser 1234 o 0000). Solo se hace la primera vez.</li><li>Toca “Conectar rodillera” y elige el puerto del HC-05. Usa Chrome o Edge.</li></ol>
      <p class="mut text-xs leading-relaxed mt-3">En celulares Android la conexión es por Bluetooth BLE y requiere una rodillera con módulo BLE. iPhone no admite Web Bluetooth en Safari.</p></div>

function App() {
  const [tab, setTab] = useState('inicio');
  const [theme, setTheme] = useState('dark');
  const [sub, setSub] = useState(null);
  const [risk, setRisk] = useState(false);
  const [demo, setDemo] = useState(false);
  const [connecting, setConnecting] = useState(null);
  const [err, setErr] = useState('');
  const [, bump] = useState(0);
  useEffect(() => {
    const f = () => bump(x => x + 1);
    BT.listeners.add(f); BT.onRisk = () => setRisk(true);
    return () => { BT.listeners.delete(f); BT.onRisk = null; };
  }, []);
  const source = Object.keys(BT.links).length || BT.demoTimer ? 'ble' : demo ? 'demo' : 'off';
  const conn = source !== 'off' ? 'on' : connecting ? 'connecting' : 'off';
  const toggleRole = async r => {
    if (BT.links[r]) { BT.disconnect(r); return; }
    setErr(''); setConnecting(r);
    try { await BT.connect(r); setDemo(false); }
    catch (e) { if (e.name !== 'NotFoundError') setErr('No se pudo conectar: ' + (e.message || e)); }
    setConnecting(null);
  };
  const toggleSerial = async r => {
    setErr(''); setConnecting(r);
    try { await BT.connectSerial(r); setDemo(false); }
    catch (e) { if (e.name !== 'NotFoundError') setErr('No se pudo abrir el puerto: ' + (e.message || e)); }
    setConnecting(null);
  };
  useEffect(() => { if (conn === 'off') setRisk(false); }, [conn]);
  const connectRodillera = async () => {
    if (Object.keys(BT.links).length) { Object.keys(BT.links).forEach(r => BT.disconnect(r)); return; }
    setErr(''); setConnecting('x');
    try { if (BT.okSerial) await BT.connectSerial(); else await BT.connect('muslo'); }
    catch (e) { if (e.name !== 'NotFoundError') setErr('No se pudo conectar: ' + (e.message || e)); }
    setConnecting(null);
  };
  const cb = { source, connecting, err, onConnect: connectRodillera, onDemo: () => BT.demoToggle() };
  const [user, setUser] = useState(LS.g('agitaf_session', null));
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  useEffect(() => { document.body.classList.toggle('riskbg', risk); }, [risk]);
  const auth = n => { LS.s('agitaf_session', n); setUser(n); };
  const logout = () => { LS.s('agitaf_session', null); setUser(null); setRisk(false); ['muslo', 'pantorrilla'].forEach(r => BT.disconnect(r)); setDemo(false); if (BT.demoTimer) BT.demoToggle(); setTab('inicio'); };
  const tabs = [['inicio', 'Inicio'], ['panel', 'Panel'], ['nosotros', 'Nosotros']];
  const gated = tab === 'inicio' && !user;
  return html`<div class="min-h-screen">
    <div class="max-w-5xl mx-auto px-5">
      <header class="flex flex-wrap items-center justify-between gap-3 py-6">
        <button onClick=${() => setTab('inicio')} class="flex items-center gap-3"><span class="w-11 h-11 rounded-full bg-white flex items-center justify-center p-1.5"><img src=${IMG.icon} alt="" class="w-full h-full object-contain"/></span><span class="serif text-2xl">AGITAF<span class="or">.</span></span></button>
        <nav class="flex flex-wrap items-center gap-x-5 gap-y-2 sm:gap-x-7">
          ${tabs.map(([k, l]) => html`<button key=${k} onClick=${() => { setTab(k); setSub(null); }} class=${'text-base sm:text-lg transition ' + (tab === k ? 'font-medium' : 'mut hover:opacity-80')}>${l}</button>`)}
          ${user && html`<button onClick=${logout} class="text-sm mut hover:opacity-80">${user} · Salir</button>`}
          <button onClick=${() => setTheme(theme === 'dark' ? 'light' : 'dark')} class="card rounded-md px-3 py-1.5 text-sm">${theme === 'dark' ? '☀ Modo claro' : '☾ Modo oscuro'}</button>
        </nav>
      </header>
      ${gated ? html`<${Login} onAuth=${auth} />` : tab === 'inicio' ? html`<${Inicio} key=${user} user=${user} go=${setTab} conn=${conn} source=${source} cb=${cb} />`  : tab === 'panel' ? html`<${PanelLive} cb=${cb} risk=${risk} setRisk=${setRisk} conn=${conn} source=${source} />` : html`<${NosotrosHub} sub=${sub} setSub=${setSub} />`}
      <footer class="flex items-center justify-center gap-2 text-xs mut pb-8"><span class="w-6 h-6 rounded-full bg-white p-1 flex items-center justify-center"><img src=${IMG.icon} alt="" class="w-full h-full object-contain"/></span>AGITAF Prototipo</footer>
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
