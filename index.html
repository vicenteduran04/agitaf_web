body{color:var(--tx);font-family:"Space Grotesk",system-ui,sans-serif;transition:background .5s;background-image:radial-gradient(60rem 30rem at 90% -10%,color-mix(in srgb,var(--or) 14%,transparent),transparent),radial-gradient(60rem 30rem at -10% 0,color-mix(in srgb,var(--bl) 14%,transparent),transparent);background-repeat:no-repeat}

.inp{width:100%;background:transparent;border:1px solid var(--bd);border-radius:.5rem;padding:.75rem 1rem;color:var(--tx);outline:none}
.inp:focus{border-color:var(--ac)}

.frame{background:#fff;border:4px solid #0a2038;border-radius:1.5rem;overflow:hidden}.blue{color:var(--bl)}
.riskbg{background:#450a0a!important}

const hash = async s => { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('agitaf:' + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return btoa(unescape(encodeURIComponent(s))); } };
const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

const STAGES = {
  'Calentamiento': { base: 28, alert: 'Sobrecarga detectada con el tejido aún frío. Reduce la intensidad de inmediato y retoma con movilidad progresiva durante 3–5 min.' },
  'Entrenamiento Técnico': { base: 46, alert: 'Carga excesiva en trabajo técnico. Detén saltos y cambios de dirección, descansa 2 min y revisa la técnica de aterrizaje.' },

const TEAM = [
  ['María Fernanda Muñoz', 'Prototipos análogos', 'Investiga prototipos análogos —dispositivos y soluciones similares que ya existen— para entender qué funciona, qué no y por qué. Su trabajo asegura que los parches AGITAF sean cómodos de usar durante el juego y viables para el cliente, sin sacrificar la precisión de las mediciones.'],
  ['José Manuel Valdés', 'Estudio de mercado', 'Analiza el mercado del deporte y la tecnología vestible: quiénes son los competidores, qué necesitan clubes, entrenadores y jugadores, y dónde hay oportunidades reales. Gracias a su estudio, AGITAF se plantea como una propuesta con sentido y no solo como una buena idea.'],
  ['Benjamín Cano', 'Sensores', 'Investiga y compara los sensores de movimiento y actividad muscular disponibles, evaluando precisión, tamaño, consumo y compatibilidad con Arduino y Bluetooth. Es quien define con qué tecnología se mide el muslo y la canilla para detectar riesgos a tiempo.'],

const N = 60;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function Hero({ eyebrow, l1, l2, desc, side }) {
  return html`<section class="pt-12 pb-8 flex flex-col lg:flex-row lg:items-center justify-between gap-10"><div class="min-w-0">
    <div class="w-20 h-0.5 mb-10" style=${{ background: 'linear-gradient(90deg,var(--or),#ffb347)' }}></div>
    <p class="ac uppercase text-sm sm:text-base mb-6" style=${{ letterSpacing: '.28em' }}>${eyebrow}</p>
    <h1 class="serif text-5xl sm:text-7xl leading-[1.05]">${l1}<br/><span class="grad">${l2}</span></h1>
    <p class="mut text-lg sm:text-xl mt-6 max-w-2xl leading-relaxed">${desc}</p></div>${side}
  </section>`;
}

function Spark({ data, color }) {
  const pts = data.map((v, i) => `${(i / (N - 1)) * 300},${100 - v}`).join(' ');
  return html`<svg viewBox="0 0 300 100" preserveAspectRatio="none" class="w-full h-24">
    ${[25, 50, 75].map(y => html`<line key=${y} x1="0" x2="300" y1=${y} y2=${y} stroke="var(--bd)" stroke-width="1"/>`)}
    <line x1="0" x2="300" y1="15" y2="15" stroke="#ef4444" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/>
    <polyline points=${pts} fill="none" stroke=${color} stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
  </svg>`;
}

function SensorCard({ title, sub, data, fatigue, risk }) {
  const v = Math.round(data[data.length - 1] || 0);
  const lvl = v >= 85 ? 'CRÍTICO' : v >= 65 ? 'ELEVADO' : 'NORMAL';
  const col = v >= 85 ? '#ef4444' : v >= 65 ? '#ff6a00' : '#6d8dff';
  return html`<div class=${'card rounded-xl p-5 ' + (risk ? '!border-red-500/70' : '')}>
    <div class="flex items-start justify-between">
      <div><h3 class="serif text-2xl">${title}</h3><p class="text-xs mut">${sub}</p></div>
      <span class="text-xs font-semibold px-2 py-1 rounded-full" style=${{ background: col + '22', color: col }}>${lvl}</span>
    </div>
    <div class="flex items-end gap-2 mt-3"><span class="text-5xl font-semibold tabular-nums" style=${{ color: col }}>${v}</span><span class="mut mb-1">% activación</span></div>
    <${Spark} data=${data} color=${col} />
    <div class="mt-3">
      <div class="flex justify-between text-xs mut mb-1"><span>Índice de fatiga</span><span>${Math.round(fatigue)}%</span></div>

}

function ConnectBar({ conn, onConnect }) {
  return html`<div class="flex flex-wrap items-center gap-3">
    <button onClick=${onConnect} class=${'px-5 py-3 rounded-lg font-medium text-sm transition ' + (conn === 'on' ? 'card ac' : conn === 'connecting' ? 'card mut animate-pulse' : 'bgac text-white hover:opacity-90')}>
      ${conn === 'on' ? '● Conectado · Desconectar' : conn === 'connecting' ? 'Buscando dispositivo…' : 'Conectar parches AGITAF (BLE)'}
    </button>
    ${conn === 'on' && html`<span class="text-xs mut">AGITAF-BLE-01 · Batería 82% · -52 dBm</span>`}
    ${conn === 'off' && html`<span class="text-xs mut">Se requiere conexión Bluetooth con los parches.</span>`}
  </div>`;
}

function Alertas({ risk, setRisk, conn, onConnect }) {
  const [stage, setStage] = useState('Calentamiento');
  const [thigh, setThigh] = useState(Array(N).fill(0));
  const [shin, setShin] = useState(Array(N).fill(0));
  const [fat, setFat] = useState({ t: 0, s: 0 });
  const [secs, setSecs] = useState(0);
  const t = useRef(0);
  const live = conn === 'on';
  useEffect(() => { if (live) { setSecs(0); setFat({ t: 0, s: 0 }); } }, [live]);
  useEffect(() => {
    if (!live) return;
    const id = setInterval(() => {
      t.current += 1;
      const b = STAGES[stage].base;
      const nT = clamp(b + (risk ? 30 : 0) + Math.sin(t.current / 5) * 9 + (Math.random() - .5) * 8, 3, 100);
      const nS = clamp(b * .85 + (risk ? 24 : 0) + Math.sin(t.current / 4 + 1) * 8 + (Math.random() - .5) * (risk ? 16 : 8), 3, 100);
      setThigh(d => [...d.slice(1), nT]);
      setShin(d => [...d.slice(1), nS]);
      setFat(f => ({ t: clamp(f.t + nT / 2500, 0, 100), s: clamp(f.s + nS / 2500, 0, 100) }));
    }, 150);
    const cl = setInterval(() => setSecs(s => s + 1), 1000);
    return () => { clearInterval(id); clearInterval(cl); };
  }, [live, stage, risk]);
  const asym = Math.round(Math.abs(thigh[N - 1] - shin[N - 1]));
  return html`<div>
    <${Hero} eyebrow="Monitor en tiempo real · Muslo y canilla" l1="Alertas de" l2="Sobrecarga" desc="Conecta los parches AGITAF, elige la etapa del jugador y monitorea la actividad muscular. Ante índices de riesgo, el entrenador recibe una alerta de descanso." />
    <div class="space-y-5 pb-16">
      <${ConnectBar} conn=${conn} onConnect=${onConnect} />
      ${risk && html`<div class="rounded-xl bg-red-600 text-white p-5 shadow-[0_0_40px_rgba(239,68,68,.45)] animate-pulse">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="text-xs font-semibold" style=${{ letterSpacing: '.25em' }}>⚠ ALERTA CRÍTICA · ${stage.toUpperCase()}</p>
            <h2 class="serif text-3xl mt-2">Detener actividad y descansar</h2>
            <p class="mt-2 text-red-50 max-w-2xl">${STAGES[stage].alert}</p>
          </div>
          <button onClick=${() => setRisk(false)} class="px-4 py-2 rounded-lg bg-white text-red-700 font-semibold text-sm">Reconocer alerta</button>
        </div>
      </div>`}
      <div class="card rounded-xl p-4">
        <p class="text-xs uppercase mut mb-3" style=${{ letterSpacing: '.25em' }}>Etapa deportiva</p>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
          ${Object.keys(STAGES).map(s => html`<button key=${s} onClick=${() => setStage(s)} class=${'px-3 py-3 rounded-lg text-sm font-medium transition border ' + (stage === s ? 'bgor text-white border-transparent' : 'border-[color:var(--bd)] hover:opacity-80')}>${s}</button>`)}
        </div>
      </div>
      ${!live ? html`<div class="rounded-xl border border-dashed p-10 text-center mut" style=${{ borderColor: 'var(--bd)' }}>Conecta los parches AGITAF para comenzar a recibir datos de los sensores.</div>` : html`<div class="space-y-5">
        <div class="grid md:grid-cols-2 gap-5">
          <${SensorCard} title="Muslo" sub="Cuádriceps · sobre la rodilla" data=${thigh} fatigue=${fat.t} risk=${risk} />
          <${SensorCard} title="Músculo inferior" sub="Canilla · bajo la rodilla" data=${shin} fatigue=${fat.s} risk=${risk} />
        </div>
        <div class="grid grid-cols-3 gap-3">
          ${[['Asimetría', asym + '%'], ['Sesión', mmss(secs)], ['Estado', risk ? 'En riesgo' : 'Estable']].map(([l, v]) =>
            html`<div key=${l} class="card rounded-xl p-4"><p class="text-xs mut">${l}</p><p class=${'text-2xl font-semibold mt-1 tabular-nums ' + (l === 'Estado' && risk ? 'text-red-400' : '')}>${v}</p></div>`)}
        </div>
      </div>`}
      <div class="flex items-center gap-3">
        <button disabled=${!live} onClick=${() => setRisk(!risk)} class=${'px-5 py-3 rounded-lg font-medium transition ' + (!live ? 'card mut cursor-not-allowed opacity-60' : risk ? 'card' : 'bg-red-600 hover:bg-red-500 text-white')}>
          ${risk ? 'Detener simulación de riesgo' : 'Simular Riesgo'}
        </button>
        ${!live && html`<span class="text-xs mut">Requiere conexión activa.</span>`}
      </div>
    </div>
  </div>`;
}

function Login({ onAuth }) {
  const [mode, setMode] = useState('in');
  const [name, setName] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const submit = async () => {
    const key = name.trim().toLowerCase();
    if (key.length < 3) return setErr('El usuario debe tener al menos 3 caracteres.');
    if (pw.length < 4) return setErr('La contraseña debe tener al menos 4 caracteres.');
    const users = LS.g('agitaf_users', {});
    const h = await hash(pw);
    if (mode === 'up') {
      if (users[key]) return setErr('Ese nombre de usuario ya existe. Elige otro.');
      users[key] = { name: name.trim(), h }; LS.s('agitaf_users', users);
    } else if (!users[key] || users[key].h !== h) return setErr('Usuario o contraseña incorrectos.');
    onAuth(users[key].name);
  };
  const enter = e => { if (e.key === 'Enter') submit(); };
  return html`<div class="pb-16">
    <${Hero} eyebrow="Acceso" l1="Ingresa a" l2="AGITAF" desc="Crea tu cuenta con un nombre de usuario y una contraseña, o inicia sesión si ya tienes una." side=${LogoSide()} />
    <div class="card rounded-xl p-6 max-w-md">
      <div class="flex gap-2 mb-5">
        ${[['in', 'Iniciar sesión'], ['up', 'Registrarse']].map(([k, l]) => html`<button key=${k} onClick=${() => { setMode(k); setErr(''); }} class=${'px-4 py-2 rounded-lg text-sm font-medium border ' + (mode === k ? 'bgac text-white border-transparent' : 'border-[color:var(--bd)] mut')}>${l}</button>`)}
      </div>
      <div class="space-y-3">
        <input class="inp" placeholder="Nombre de usuario" value=${name} onInput=${e => setName(e.target.value)} onKeyDown=${enter} autocomplete="username" />
        <input class="inp" type="password" placeholder="Contraseña" value=${pw} onInput=${e => setPw(e.target.value)} onKeyDown=${enter} autocomplete=${mode === 'up' ? 'new-password' : 'current-password'} />
        ${err && html`<p class="text-sm text-red-400">${err}</p>`}
        <button onClick=${submit} class="btn bgor w-full">${mode === 'up' ? 'Crear cuenta' : 'Entrar'}</button>
      </div>
    </div>
  </div>`;
}

function Inicio({ user, go, conn, onConnect }) {
  const key = 'agitaf_cal_' + user.toLowerCase();
  const [run, setRun] = useState(false);
  const [secs, setSecs] = useState(0);
  const [jumps, setJumps] = useState(0);
  const [last, setLast] = useState(null);
  const [cal, setCal] = useState(LS.g(key, 0));
  const [calRun, setCalRun] = useState(false);
  const [calJ, setCalJ] = useState(0);
  const [fb, setFb] = useState(null); // null | 'open' | 'saved'
  const [eff, setEff] = useState(5);
  const [pain, setPain] = useState('Ninguna');
  const TARGET = 20;
  useEffect(() => {
    if (!run) return;
    const id = setInterval(() => { setSecs(s => s + 1); setJumps(j => j + Math.floor(Math.random() * 3)); }, 1000);
    return () => clearInterval(id);
  }, [run]);
  useEffect(() => {
    if (!calRun) return;
    const id = setInterval(() => setCalJ(j => j + 1), 1800);
    return () => clearInterval(id);
  }, [calRun]);
  useEffect(() => {
    if (calRun && calJ >= TARGET) { setCalRun(false); const c = Math.min(3, cal + 1); setCal(c); LS.s(key, c); }
  }, [calJ, calRun]);
  useEffect(() => {
    if (conn !== 'on') { setCalRun(false); if (run) { setLast({ jumps, secs }); setRun(false); setFb(null); } }
  }, [conn]);
  const toggle = () => {
    if (run) { setLast({ jumps, secs }); setRun(false); setFb(null); }
    else { setSecs(0); setJumps(0); setRun(true); }
  };
  const done = cal >= 3;
  const Btn = (label, fn, dis) => html`<button onClick=${fn} disabled=${dis} class="btn bgor w-full mt-auto">${label}</button>`;
  return html`<div class="pb-16">
    <${Hero} eyebrow=${'Hola, ' + user} l1="Panel de" l2="Sesión Deportiva" desc="Inicia una sesión deportiva en vivo, revisa cómo te fue y mantén calibrados tus sensores." side=${LogoSide()} />
    <div class="mb-6"><${ConnectBar} conn=${conn} onConnect=${onConnect} /></div>
    <div class="grid md:grid-cols-3 gap-5">

      <div class="card rounded-xl p-6 flex flex-col gap-3">
        <p class="or text-xs font-semibold" style=${{ letterSpacing: '.25em' }}>AGITAF</p>
        <h3 class="serif text-3xl">Sesión en vivo</h3>
        <p class="mut">${run ? 'Sensores conectados · batería 82 %' : conn === 'on' ? 'Parches conectados · sin sesión deportiva activa' : 'Parches desconectados · conéctalos para comenzar'}</p>
        <div class="mt-3"><p class="mut text-sm">Saltos detectados</p><p class="text-5xl font-semibold tabular-nums">${jumps}</p></div>
        <p class="mut mb-4">Duración: ${mmss(secs)} min</p>
        ${Btn(run ? 'Finalizar sesión deportiva' : 'Iniciar sesión deportiva', toggle, !run && conn !== 'on')}
        <button onClick=${() => go('alertas')} class="ac text-sm text-left">Abrir monitor de alertas →</button>
      </div>

      <div class="card rounded-xl p-6 flex flex-col gap-3">
        <p class="or text-xs font-semibold" style=${{ letterSpacing: '.25em' }}>AGITAF</p>
        <h3 class="serif text-3xl">Revisar sesión</h3>
        ${last ? html`<div class="flex flex-col gap-3 flex-1">
          <p class="mut">Tu patrón de aterrizaje cambió</p>
          <p class="text-sm mut">Última sesión: ${last.jumps} saltos · ${mmss(last.secs)} min</p>
          <p class="mt-2">Comprueba la colocación de los parches.</p>
          <p>¿Cómo te sientes? Registra molestias y esfuerzo.</p>
          ${fb === 'open' && html`<div class="space-y-3 mb-2">
            <label class="text-sm mut block">Esfuerzo percibido: <span class="or font-semibold">${eff}/10</span>
              <input type="range" min="1" max="10" value=${eff} onInput=${e => setEff(+e.target.value)} class="w-full" style=${{ accentColor: 'var(--or)' }} /></label>
            <div class="flex flex-wrap gap-2">${['Ninguna', 'Muslo', 'Canilla'].map(p => html`<button key=${p} onClick=${() => setPain(p)} class=${'text-sm px-3 py-1 rounded-full border ' + (pain === p ? 'bgac text-white border-transparent' : 'border-[color:var(--bd)] mut')}>${p}</button>`)}</div>
          </div>`}
          ${fb === 'saved' ? html`<p class="ac text-sm mt-auto">✓ Registro guardado (esfuerzo ${eff}/10 · molestia: ${pain})</p>` : Btn(fb === 'open' ? 'Guardar registro' : 'Registrar cómo me siento', () => setFb(fb === 'open' ? 'saved' : 'open'))}
        </div>` : html`<p class="mut">Aún no hay sesiones deportivas terminadas.</p><p class="flex-1">Finaliza una sesión deportiva para poder revisarla.</p>`}
      </div>

      <div class="card rounded-xl p-6 flex flex-col gap-3">
        <p class="or text-xs font-semibold" style=${{ letterSpacing: '.25em' }}>AGITAF</p>
        <h3 class="serif text-3xl">Calibración</h3>
        <p class="mut">${done ? 'Sensores calibrados ✓' : 'Sesión de calibración ' + (cal + 1) + ' de 3'}</p>
        <div class="flex gap-2 my-2">${[0, 1, 2].map(i => html`<div key=${i} class="h-2 flex-1 rounded-full" style=${{ background: i < cal ? 'var(--or)' : 'var(--trk)' }}></div>`)}</div>
        ${calRun ? html`<div><p class="mut text-sm">¡Salta ahora! Idealmente entre 15 y 20 veces.</p><p class="text-5xl font-semibold tabular-nums">${Math.min(calJ, TARGET)}<span class="mut text-2xl"> / ${TARGET}</span></p></div>`
          : html`<p class="text-sm mut flex-1">Al inicio de las primeras sesiones el dispositivo te pide saltar entre 15 y 20 veces. En la tercera sesión queda calibrado.</p>`}
        ${calRun ? Btn('Calibrando…', () => {}, true) : Btn(done ? 'Recalibrar' : 'Iniciar calibración', () => { setCalJ(0); setCalRun(true); }, conn !== 'on')}
      </div>
    </div>
    ${DidYouKnow()}
  </div>`;
}

    <div class="frame w-20 h-20 shrink-0"><img src=${IMG.knee} alt="" class="w-full h-full object-cover"/></div>

function App() {
  const [tab, setTab] = useState('inicio');
  const [theme, setTheme] = useState('dark');
  const [risk, setRisk] = useState(false);
  const [conn, setConn] = useState('off');
  const connect = () => {
    if (conn === 'connecting') return;
    if (conn === 'on') { setConn('off'); setRisk(false); return; }
    setConn('connecting');
    setTimeout(() => setConn('on'), 1800);
  };
  const [user, setUser] = useState(LS.g('agitaf_session', null));
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  useEffect(() => { document.body.classList.toggle('riskbg', risk); }, [risk]);
  const auth = n => { LS.s('agitaf_session', n); setUser(n); };
  const logout = () => { LS.s('agitaf_session', null); setUser(null); setRisk(false); setConn('off'); setTab('inicio'); };
  const tabs = [['inicio', 'Inicio'], ['alertas', 'Alertas'], ['nosotros', 'Nosotros'], ['equipo', 'Equipo']];
  const gated = (tab === 'inicio' || tab === 'alertas') && !user;
  return html`<div class="min-h-screen">
    <div class="max-w-5xl mx-auto px-5">
      <header class="flex flex-wrap items-center justify-between gap-3 py-6">
        <button onClick=${() => setTab('inicio')} class="flex items-center gap-3"><span class="w-11 h-11 rounded-full bg-white flex items-center justify-center p-1.5"><img src=${IMG.icon} alt="" class="w-full h-full object-contain"/></span><span class="serif text-2xl">AGITAF<span class="or">.</span></span></button>
        <nav class="flex flex-wrap items-center gap-x-5 gap-y-2 sm:gap-x-7">
          ${tabs.map(([k, l]) => html`<button key=${k} onClick=${() => setTab(k)} class=${'text-base sm:text-lg transition ' + (tab === k ? 'font-medium' : 'mut hover:opacity-80')}>${l}</button>`)}
          ${user && html`<button onClick=${logout} class="text-sm mut hover:opacity-80">${user} · Salir</button>`}
          <button onClick=${() => setTheme(theme === 'dark' ? 'light' : 'dark')} class="card rounded-md px-3 py-1.5 text-sm">${theme === 'dark' ? '☀ Modo claro' : '☾ Modo oscuro'}</button>
        </nav>
      </header>
      ${gated ? html`<${Login} onAuth=${auth} />` : tab === 'inicio' ? html`<${Inicio} key=${user} user=${user} go=${setTab} conn=${conn} onConnect=${connect} />` : tab === 'alertas' ? html`<${Alertas} risk=${risk} setRisk=${setRisk} conn=${conn} onConnect=${connect} />` : tab === 'nosotros' ? html`<${Nosotros} />` : html`<${Equipo} />`}
      <footer class="flex items-center justify-center gap-2 text-xs mut pb-8"><span class="w-6 h-6 rounded-full bg-white p-1 flex items-center justify-center"><img src=${IMG.icon} alt="" class="w-full h-full object-contain"/></span>AGITAF Prototipo</footer>
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
